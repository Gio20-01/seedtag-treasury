name = "seedtag-treasury"
main = "src/index.js"
compatibility_date = "2026-08-01"

# workers.dev URL must be DISABLED after first deploy (Cloudflare dashboard ->
# Settings -> Domains & Routes) to prevent header-forgery bypass of the
# Centrale auth - same rule as every other specific Worker in People Hub 2.0.

[[d1_databases]]
binding = "DB"
database_name = "seedtag-treasury-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
SHEET_ID = "1cjCJWSdIlhTY1-DRIJjmCM-RoEEe0OYB0iVIX3gkPfs"
ADJDATA_TAB = "[IMPORT] AdjData"
TREASURY_EMAIL_GAS_URL = "REPLACE_WITH_EMAIL_SENDER_WEBAPP_URL"
PAYMENT_DAY_DEFAULT = "10"

# Secrets - set via `wrangler secret put <NAME>`, never in this file:
#   INTERNAL_SECRET       (shared with Centrale, validates X-Internal-Auth)
#   GOOGLE_SA_KEY          (Service Account JSON, Sheets API read access)
#   TREASURY_GAS_SECRET    (shared with Treasury_Email_Sender.gs)

[triggers]
# Daily changelog diff, 15 min after the GAS Personio import (2:00 AM)
crons = ["15 2 * * *"]
